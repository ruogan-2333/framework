          });
          allEdges.add(filtered);
          activeEdgeIds = filtered.map(e => e.id);
        }
      });

      setDetail(renderTimeline());
    } catch (err) {
      showRuntimeError((err && err.message) ? err.message : String(err));
    }
  </script>
</body>
</html>
